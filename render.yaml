services:
  # Backend Node.js Service (Express + Socket.IO + MongoDB/JSON DB)
  - type: web
    name: nebula-chat-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
        - package.json
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # Frontend Vite Static Site
  - type: web
    name: nebula-chat-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nebula-chat-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: nebula-chat-backend
          property: host