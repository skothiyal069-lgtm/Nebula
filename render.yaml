services:
  # Backend Node.js Service (Runs the main server + compiles C++ core)
  - type: web
    name: nebula-chat-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd ../cpp_core && make CXX=g++ && cd ../backend
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false # You can enter your MongoDB Atlas URL here later, otherwise it falls back to the local JSON db
      - key: JWT_SECRET
        generateValue: true

  # Frontend Vite Static Site
  - type: web
    name: nebula-chat-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: nebula-chat-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: nebula-chat-backend
          property: host
